name: Publish

# Publishes the distributions to PyPI when a GitHub release is published.
#
# Two properties matter here and are enforced rather than assumed:
#
#   1. Nothing outside the public file policy can be shipped. The distributions are
#      built from the allowlisted export produced by tools/verify_public_release.py,
#      exactly as the CI `package` job does, and the built artefacts are then verified
#      against the same policy before any upload step runs.
#   2. No long-lived credentials exist. Upload uses PyPI trusted publishing (OIDC), so
#      the job mints a short-lived token from its own identity. There is no API token
#      in repository secrets.
#
# workflow_dispatch allows a TestPyPI dry run, and a build-only run that uploads
# nowhere, without cutting a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload the verified distributions
        type: choice
        default: testpypi
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the public distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build backend
        run: python -m pip install -c constraints-py311-py312-py313.txt build

      - name: Export only the allowlisted public files
        run: python tools/verify_public_release.py --files-only --export ../public-profile-export

      - name: Build the distributions from the export
        run: python -m build ../public-profile-export --outdir dist

      - name: Verify the built distributions against the file policy
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.verify_public_release import verify_archive
          paths = sorted(Path("dist").iterdir())
          assert paths, "no distributions were built"
          for path in paths:
              print(path.name, verify_archive(path), "files verified")
          PY

      - name: Check the release tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          from tools.verify_public_release import distribution_version
          tag = os.environ["TAG"]
          version = distribution_version()
          assert tag == f"v{version}", f"tag {tag} does not match packaged version {version}"
          print(f"tag {tag} matches packaged version {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for trusted publishing; no API token is used
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing; no API token is used
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
