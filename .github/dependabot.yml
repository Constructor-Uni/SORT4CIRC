version: 2

updates:
  # Runtime and development Python dependencies. Version bumps must keep the pinned
  # constraints file in step: see constraints-py311-py312-py313.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    # One grouped pull request per week instead of one per package. Every pip bump
    # edits constraints-py311-py312-py313.txt and, through it, MANIFEST.sha256, so
    # ungrouped siblings serialise behind each other once a branch must be current.
    # applies-to: version-updates leaves security advisories ungrouped so they still
    # arrive individually.
    groups:
      # Listed first: Dependabot puts a dependency in the first group it matches.
      # pydantic pins its core with `pydantic-core==`, so bumping one without the other
      # is unresolvable. They move as a unit, at any update type.
      pydantic:
        applies-to: version-updates
        patterns: ["pydantic", "pydantic-core"]
      python-safe:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  # Workflow actions are pinned to commit SHAs. Dependabot updates the SHA and the
  # trailing version comment together, which keeps the pinning intact.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    # Majors are kept apart from minor and patch bumps: a single incompatible action
    # major would otherwise block the safe updates travelling with it.
    groups:
      actions-safe:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
