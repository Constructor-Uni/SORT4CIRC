# Development stack: the reference service, plus an optional Besu node for
# exercising the anchoring path against a real permissioned network.
services:
  dpp:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      S4C_ALLOW_HEADER_AUTH: "1"   # development stand-in only, never in production
      S4C_LEDGER_NETWORK: "s4c-reference"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional. Start with: docker compose --profile ledger up
  besu:
    # Besu 26.8.1 for linux/amd64; platform manifest verified against Docker Hub 2026-09-03.
    image: hyperledger/besu:26.8.1@sha256:c674f62b76c33af56e4817c4b091181558ae81d62646599f99fe63df8f886825
    platform: linux/amd64
    profiles: ["ledger"]
    command:
      - --network=dev
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-cors-origins=all
      - --host-allowlist=*
      - --min-gas-price=0
    ports:
      - "8545:8545"
